name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: repairvantage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repairvantage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service container scoped to this job. No hosted credentials.
      DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/repairvantage_test
      TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/repairvantage_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm --prefix client run lint
      - run: npm --prefix client run build
      - run: npm --prefix server run build
      - run: npm --prefix server test
      - run: npm --prefix server run prisma:deploy
      - run: npm --prefix server run test:integration
      - run: npm --prefix server run test:auth
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: client
      - name: Verify workspace and sharing in Chromium
        run: |
          node server/test/browser-server.cjs &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:4000/ready
          REAL_API=1 npm --prefix client test
